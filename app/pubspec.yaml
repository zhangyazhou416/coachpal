name: fitfuel_app
description: FitFuel 跨平台健身饮食记录（Android/iOS/Web/鸿蒙）
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  drift: ^2.20.0            # 跨平台 SQLite（含 Web/wasm）
  sqlite3_flutter_libs: ^0.5.24   # Android/iOS/桌面端 SQLite 库（Web 走 wasm，无需此包）
  flutter_riverpod: ^2.5.1
  fl_chart: ^0.68.0
  http: ^1.2.0
  uuid: ^4.4.0
  intl: ^0.19.0
  shared_preferences: ^2.3.0
  flutter_secure_storage: ^9.2.2
  path_provider: ^2.1.3
  cached_network_image: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  drift_dev: ^2.20.0
  build_runner: ^2.4.11
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
